<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Secured Card Research Agent</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
            background: rgba(255, 255, 255, 0.95);
            border-radius: 20px;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.1);
            overflow: hidden;
        }

        .header {
            background: linear-gradient(135deg, #2c3e50, #34495e);
            color: white;
            padding: 30px;
            text-align: center;
        }

        .header h1 {
            font-size: 2.5em;
            margin-bottom: 10px;
            font-weight: 300;
        }

        .header p {
            font-size: 1.1em;
            opacity: 0.9;
        }

        .main-content {
            padding: 40px;
        }

        .control-panel {
            background: #f8f9fa;
            border-radius: 15px;
            padding: 30px;
            margin-bottom: 30px;
            border: 1px solid #e9ecef;
        }

        .form-group {
            margin-bottom: 20px;
        }

        .form-group label {
            display: block;
            margin-bottom: 8px;
            font-weight: 600;
            color: #2c3e50;
        }

        .form-group input,
        .form-group select,
        .form-group textarea {
            width: 100%;
            padding: 12px 16px;
            border: 2px solid #e9ecef;
            border-radius: 8px;
            font-size: 14px;
            transition: border-color 0.3s ease;
        }

        .form-group input:focus,
        .form-group select:focus,
        .form-group textarea:focus {
            outline: none;
            border-color: #667eea;
            box-shadow: 0 0 0 3px rgba(102, 126, 234, 0.1);
        }

        .checkbox-group {
            display: flex;
            flex-wrap: wrap;
            gap: 15px;
            margin-top: 10px;
        }

        .checkbox-item {
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .checkbox-item input[type="checkbox"] {
            width: auto;
        }

        .btn {
            background: linear-gradient(135deg, #667eea, #764ba2);
            color: white;
            border: none;
            padding: 15px 30px;
            border-radius: 8px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            display: inline-flex;
            align-items: center;
            gap: 10px;
        }

        .btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 20px rgba(102, 126, 234, 0.3);
        }

        .btn:disabled {
            opacity: 0.6;
            cursor: not-allowed;
            transform: none;
        }

        .btn-secondary {
            background: linear-gradient(135deg, #95a5a6, #7f8c8d);
        }

        .results-section {
            margin-top: 30px;
        }

        .results-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
        }

        .results-stats {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 20px;
            margin-bottom: 30px;
        }

        .stat-card {
            background: white;
            border-radius: 12px;
            padding: 20px;
            text-align: center;
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.08);
            border: 1px solid #e9ecef;
        }

        .stat-number {
            font-size: 2.5em;
            font-weight: 700;
            color: #667eea;
            margin-bottom: 5px;
        }

        .stat-label {
            color: #6c757d;
            font-size: 14px;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .results-table {
            background: white;
            border-radius: 12px;
            overflow: hidden;
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.08);
            border: 1px solid #e9ecef;
        }

        .table-header {
            background: #f8f9fa;
            padding: 20px;
            border-bottom: 1px solid #e9ecef;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .table-content {
            max-height: 600px;
            overflow-y: auto;
        }

        .company-card {
            border-bottom: 1px solid #e9ecef;
            padding: 20px;
            transition: background-color 0.3s ease;
        }

        .company-card:hover {
            background-color: #f8f9fa;
        }

        .company-card:last-child {
            border-bottom: none;
        }

        .company-header {
            display: flex;
            justify-content: between;
            align-items: flex-start;
            margin-bottom: 15px;
        }

        .company-name {
            font-size: 1.3em;
            font-weight: 700;
            color: #2c3e50;
            margin-bottom: 5px;
        }

        .company-website {
            color: #667eea;
            text-decoration: none;
            font-size: 14px;
        }

        .company-website:hover {
            text-decoration: underline;
        }

        .company-details {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 15px;
            margin-bottom: 15px;
        }

        .detail-item {
            display: flex;
            flex-direction: column;
        }

        .detail-label {
            font-size: 12px;
            color: #6c757d;
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-bottom: 3px;
        }

        .detail-value {
            font-weight: 600;
            color: #2c3e50;
        }

        .leaders-section {
            margin-top: 15px;
            padding-top: 15px;
            border-top: 1px solid #e9ecef;
        }

        .leaders-title {
            font-size: 16px;
            font-weight: 600;
            color: #2c3e50;
            margin-bottom: 10px;
        }

        .leader-card {
            background: #f8f9fa;
            border-radius: 8px;
            padding: 15px;
            margin-bottom: 10px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .leader-info {
            flex: 1;
        }

        .leader-name {
            font-weight: 600;
            color: #2c3e50;
            margin-bottom: 3px;
        }

        .leader-title {
            color: #6c757d;
            font-size: 14px;
        }

        .leader-linkedin {
            color: #0077b5;
            text-decoration: none;
            font-size: 14px;
            font-weight: 500;
        }

        .leader-linkedin:hover {
            text-decoration: underline;
        }

        .loading {
            text-align: center;
            padding: 40px;
        }

        .spinner {
            width: 40px;
            height: 40px;
            border: 4px solid #f3f3f3;
            border-top: 4px solid #667eea;
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin: 0 auto 20px;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        .error {
            background: #f8d7da;
            color: #721c24;
            padding: 15px;
            border-radius: 8px;
            border: 1px solid #f5c6cb;
            margin-bottom: 20px;
        }

        .success {
            background: #d4edda;
            color: #155724;
            padding: 15px;
            border-radius: 8px;
            border: 1px solid #c3e6cb;
            margin-bottom: 20px;
        }

        .progress-bar {
            width: 100%;
            height: 8px;
            background: #e9ecef;
            border-radius: 4px;
            overflow: hidden;
            margin: 20px 0;
        }

        .progress-fill {
            height: 100%;
            background: linear-gradient(135deg, #667eea, #764ba2);
            width: 0%;
            transition: width 0.3s ease;
        }

        @media (max-width: 768px) {
            .container {
                margin: 10px;
                border-radius: 15px;
            }

            .main-content {
                padding: 20px;
            }

            .header {
                padding: 20px;
            }

            .header h1 {
                font-size: 2em;
            }

            .results-stats {
                grid-template-columns: repeat(2, 1fr);
            }

            .company-details {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>🔍 Secured Card Research Agent</h1>
            <p>Discover companies with secured credit cards and their product leaders</p>
        </div>

        <div class="main-content">
            <div class="control-panel">
                <h2 style="margin-bottom: 25px; color: #2c3e50;">Research Configuration</h2>
                
                <div class="form-group">
                    <label for="search-mode">Search Mode</label>
                    <select id="search-mode">
                        <option value="comprehensive">Comprehensive Search (Recommended)</option>
                        <option value="known-companies">Known Companies Only</option>
                        <option value="custom">Custom Company List</option>
                    </select>
                </div>

                <div class="form-group" id="custom-companies-group" style="display: none;">
                    <label for="custom-companies">Custom Company List (comma-separated)</label>
                    <textarea id="custom-companies" rows="3" placeholder="Capital One, Discover, Chase, etc."></textarea>
                </div>

                <div class="form-group">
                    <label>Research Options</label>
                    <div class="checkbox-group">
                        <div class="checkbox-item">
                            <input type="checkbox" id="include-leaders" checked>
                            <label for="include-leaders">Find Product Leaders</label>
                        </div>
                        <div class="checkbox-item">
                            <input type="checkbox" id="include-linkedin" checked>
                            <label for="include-linkedin">Search LinkedIn</label>
                        </div>
                        <div class="checkbox-item">
                            <input type="checkbox" id="include-websites">
                            <label for="include-websites">Search Company Websites</label>
                        </div>
                        <div class="checkbox-item">
                            <input type="checkbox" id="export-csv" checked>
                            <label for="export-csv">Export to CSV</label>
                        </div>
                    </div>
                </div>

                <div class="form-group">
                    <label for="max-companies">Maximum Companies to Research</label>
                    <input type="number" id="max-companies" value="30" min="5" max="100">
                </div>

                <div class="form-group">
                    <label for="api-key">Google API Key (Optional - for enhanced search)</label>
                    <input type="password" id="api-key" placeholder="Enter your Google Custom Search API key">
                </div>

                <button class="btn" onclick="startResearch()">
                    <span>🚀</span>
                    Start Research
                </button>
                
                <button class="btn btn-secondary" onclick="exportResults()" id="export-btn" style="display: none; margin-left: 10px;">
                    <span>📊</span>
                    Export Results
                </button>
            </div>

            <div id="progress-section" style="display: none;">
                <h3>Research Progress</h3>
                <div class="progress-bar">
                    <div class="progress-fill" id="progress-fill"></div>
                </div>
                <div id="progress-text">Initializing research...</div>
            </div>

            <div class="results-section" id="results-section" style="display: none;">
                <div class="results-header">
                    <h2>Research Results</h2>
                    <span id="last-updated"></span>
                </div>

                <div class="results-stats" id="results-stats">
                    <!-- Stats will be populated here -->
                </div>

                <div class="results-table">
                    <div class="table-header">
                        <h3>Companies & Product Leaders</h3>
                        <div>
                            <button class="btn btn-secondary" onclick="filterResults()">
                                <span>🔍</span>
                                Filter
                            </button>
                        </div>
                    </div>
                    <div class="table-content" id="results-content">
                        <!-- Results will be populated here -->
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script>
        let researchResults = null;
        let isResearching = false;

        // Handle search mode changes
        document.getElementById('search-mode').addEventListener('change', function() {
            const customGroup = document.getElementById('custom-companies-group');
            if (this.value === 'custom') {
                customGroup.style.display = 'block';
            } else {
                customGroup.style.display = 'none';
            }
        });

        async function startResearch() {
            if (isResearching) return;
            
            isResearching = true;
            const startBtn = document.querySelector('.btn');
            startBtn.disabled = true;
            startBtn.innerHTML = '<span>⏳</span> Researching...';

            // Show progress section
            document.getElementById('progress-section').style.display = 'block';
            document.getElementById('results-section').style.display = 'none';

            try {
                // Simulate research progress
                await simulateResearch();
                
                // Generate mock results for demonstration
                researchResults = generateMockResults();
                
                // Display results
                displayResults(researchResults);
                
                // Show success message
                showMessage('Research completed successfully!', 'success');
                
            } catch (error) {
                showMessage('Research failed: ' + error.message, 'error');
            } finally {
                isResearching = false;
                startBtn.disabled = false;
                startBtn.innerHTML = '<span>🚀</span> Start Research';
                document.getElementById('progress-section').style.display = 'none';
            }
        }

        async function simulateResearch() {
            const steps = [
                'Searching for secured card companies...',
                'Analyzing company websites...',
                'Finding product leaders...',
                'Searching LinkedIn profiles...',
                'Compiling results...'
            ];

            for (let i = 0; i < steps.length; i++) {
                updateProgress((i + 1) / steps.length * 100, steps[i]);
                await new Promise(resolve => setTimeout(resolve, 1500));
            }
        }

        function updateProgress(percentage, text) {
            document.getElementById('progress-fill').style.width = percentage + '%';
            document.getElementById('progress-text').textContent = text;
        }

        function generateMockResults() {
            const companies = [
                {
                    name: 'Capital One',
                    website: 'https://www.capitalone.com',
                    product: 'Capital One Secured Mastercard',
                    annualFee: '$0',
                    minDeposit: '$200',
                    leaders: [
                        { name: 'Sarah Johnson', title: 'VP Product Management', linkedin: 'https://linkedin.com/in/sarah-johnson' },
                        { name: 'Michael Chen', title: 'Director of Card Products', linkedin: 'https://linkedin.com/in/michael-chen' }
                    ]
                },
                {
                    name: 'Discover',
                    website: 'https://www.discover.com',
                    product: 'Discover it® Secured Credit Card',
                    annualFee: '$0',
                    minDeposit: '$200',
                    leaders: [
                        { name: 'Jessica Rodriguez', title: 'Head of Product', linkedin: 'https://linkedin.com/in/jessica-rodriguez' },
                        { name: 'David Kim', title: 'Senior Product Manager', linkedin: 'https://linkedin.com/in/david-kim' }
                    ]
                },
                {
                    name: 'Wells Fargo',
                    website: 'https://www.wellsfargo.com',
                    product: 'Wells Fargo Secured Credit Card',
                    annualFee: '$25',
                    minDeposit: '$300',
                    leaders: [
                        { name: 'Amanda Thompson', title: 'VP Digital Products', linkedin: 'https://linkedin.com/in/amanda-thompson' }
                    ]
                },
                {
                    name: 'Chime',
                    website: 'https://www.chime.com',
                    product: 'Chime Credit Builder Visa',
                    annualFee: '$0',
                    minDeposit: '$200',
                    leaders: [
                        { name: 'Ryan Martinez', title: 'Chief Product Officer', linkedin: 'https://linkedin.com/in/ryan-martinez' },
                        { name: 'Emily Davis', title: 'Head of Credit Products', linkedin: 'https://linkedin.com/in/emily-davis' }
                    ]
                },
                {
                    name: 'Self',
                    website: 'https://www.self.inc',
                    product: 'Self Visa® Secured Credit Card',
                    annualFee: '$25',
                    minDeposit: '$100',
                    leaders: [
                        { name: 'Alex Wilson', title: 'VP Product', linkedin: 'https://linkedin.com/in/alex-wilson' }
                    ]
                }
            ];

            return {
                companies: companies,
                summary: {
                    totalCompanies: companies.length,
                    totalLeaders: companies.reduce((sum, c) => sum + c.leaders.length, 0),
                    companiesWithLeaders: companies.filter(c => c.leaders.length > 0).length
                }
            };
        }

        function displayResults(results) {
            // Update stats
            const statsHtml = `
                <div class="stat-card">
                    <div class="stat-number">${results.summary.totalCompanies}</div>
                    <div class="stat-label">Companies Found</div>
                </div>
                <div class="stat-card">
                    <div class="stat-number">${results.summary.totalLeaders}</div>
                    <div class="stat-label">Product Leaders</div>
                </div>
                <div class="stat-card">
                    <div class="stat-number">${results.summary.companiesWithLeaders}</div>
                    <div class="stat-label">Companies with Leaders</div>
                </div>
                <div class="stat-card">
                    <div class="stat-number">${(results.summary.totalLeaders / results.summary.companiesWithLeaders).toFixed(1)}</div>
                    <div class="stat-label">Avg Leaders/Company</div>
                </div>
            `;
            document.getElementById('results-stats').innerHTML = statsHtml;

            // Update results content
            const resultsHtml = results.companies.map(company => `
                <div class="company-card">
                    <div class="company-header">
                        <div>
                            <div class="company-name">${company.name}</div>
                            <a href="${company.website}" target="_blank" class="company-website">${company.website}</a>
                        </div>
                    </div>
                    
                    <div class="company-details">
                        <div class="detail-item">
                            <div class="detail-label">Product</div>
                            <div class="detail-value">${company.product}</div>
                        </div>
                        <div class="detail-item">
                            <div class="detail-label">Annual Fee</div>
                            <div class="detail-value">${company.annualFee}</div>
                        </div>
                        <div class="detail-item">
                            <div class="detail-label">Min Deposit</div>
                            <div class="detail-value">${company.minDeposit}</div>
                        </div>
                        <div class="detail-item">
                            <div class="detail-label">Leaders Found</div>
                            <div class="detail-value">${company.leaders.length}</div>
                        </div>
                    </div>
                    
                    ${company.leaders.length > 0 ? `
                        <div class="leaders-section">
                            <div class="leaders-title">Product Leaders</div>
                            ${company.leaders.map(leader => `
                                <div class="leader-card">
                                    <div class="leader-info">
                                        <div class="leader-name">${leader.name}</div>
                                        <div class="leader-title">${leader.title}</div>
                                    </div>
                                    <a href="${leader.linkedin}" target="_blank" class="leader-linkedin">LinkedIn →</a>
                                </div>
                            `).join('')}
                        </div>
                    ` : ''}
                </div>
            `).join('');

            document.getElementById('results-content').innerHTML = resultsHtml;
            document.getElementById('results-section').style.display = 'block';
            document.getElementById('export-btn').style.display = 'inline-flex';
            document.getElementById('last-updated').textContent = `Last updated: ${new Date().toLocaleString()}`;
        }

        function exportResults() {
            if (!researchResults) return;

            const csvContent = generateCSV(researchResults);
            downloadCSV(csvContent, 'secured_card_research.csv');
            showMessage('Results exported successfully!', 'success');
        }

        function generateCSV(results) {
            const headers = ['Company', 'Product', 'Website', 'Annual Fee', 'Min Deposit', 'Leader Name', 'Leader Title', 'LinkedIn URL'];
            const rows = [headers];

            results.companies.forEach(company => {
                if (company.leaders.length > 0) {
                    company.leaders.forEach(leader => {
                        rows.push([
                            company.name,
                            company.product,
                            company.website,
                            company.annualFee,
                            company.minDeposit,
                            leader.name,
                            leader.title,
                            leader.linkedin
                        ]);
                    });
                } else {
                    rows.push([
                        company.name,
                        company.product,
                        company.website,
                        company.annualFee,
                        company.minDeposit,
                        '',
                        '',
                        ''
                    ]);
                }
            });

            return rows.map(row => row.map(field => `"${field}"`).join(',')).join('\n');
        }

        function downloadCSV(content, filename) {
            const blob = new Blob([content], { type: 'text/csv;charset=utf-8;' });
            const link = document.createElement('a');
            if (link.download !== undefined) {
                const url = URL.createObjectURL(blob);
                link.setAttribute('href', url);
                link.setAttribute('download', filename);
                link.style.visibility = 'hidden';
                document.body.appendChild(link);
                link.click();
                document.body.removeChild(link);
            }
        }

        function showMessage(message, type) {
            const messageDiv = document.createElement('div');
            messageDiv.className = type;
            messageDiv.textContent = message;
            
            const controlPanel = document.querySelector('.control-panel');
            controlPanel.insertBefore(messageDiv, controlPanel.firstChild);
            
            setTimeout(() => {
                messageDiv.remove();
            }, 5000);
        }

        function filterResults() {
            // Implement filtering functionality
            alert('Filter functionality would be implemented here');
        }
    </script>
</body>
</html>
